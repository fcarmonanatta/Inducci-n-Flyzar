<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inducción Flyzar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior tipo panel de despacho + columna de trabajo de 1100px; las etapas se leen como un checklist de cabina. */
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --ink: #14202b;
  --muted: #5a6774;
  --line: #d6dde4;
  --accent: #c8440c;       /* naranja internacional, el color de seguridad aeronáutica */
  --accent-ink: #ffffff;
  --ok: #2b7a3b;
  --warn: #9a6512;
  --bad: #c0262d;
  --ok-bg: #e5f2e7;
  --warn-bg: #fbf0dc;
  --bad-bg: #fbe5e5;
  --mark: #fff1c2;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141b; --surface: #15202a; --ink: #e4ebf1; --muted: #93a2b0; --line: #26343f;
    --accent: #ff7a3d; --accent-ink: #1a0d05; --ok: #6ccf7f; --warn: #f0b64a; --bad: #ff7373;
    --ok-bg: #16301d; --warn-bg: #33270f; --bad-bg: #3a1717; --mark: #4a3a0a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141b; --surface: #15202a; --ink: #e4ebf1; --muted: #93a2b0; --line: #26343f;
  --accent: #ff7a3d; --accent-ink: #1a0d05; --ok: #6ccf7f; --warn: #f0b64a; --bad: #ff7373;
  --ok-bg: #16301d; --warn-bg: #33270f; --bad-bg: #3a1717; --mark: #4a3a0a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f-body); }
a { color: inherit; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.05; }
h2 { font-size: 1.35rem; line-height: 1.15; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); color: var(--bg); }
.top-in { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.marca { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.marca span { font-family: var(--f-mono); font-weight: 400; font-size: .75rem; letter-spacing: .1em; opacity: .7; }
.marca::before { content: ""; width: 12px; height: 12px; background: var(--accent); transform: rotate(45deg); }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { text-decoration: none; padding: 6px 12px; border-radius: var(--r); font-weight: 500; opacity: .75; }
.nav a:hover { opacity: 1; }
.nav a[aria-current="page"] { opacity: 1; background: color-mix(in srgb, var(--bg) 14%, transparent); }

main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 64px; display: flex; flex-direction: column; gap: 20px; }

.cab { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.cab > div { min-width: 0; }
.eyebrow { margin: 0 0 4px; font-family: var(--f-mono); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.bajada { margin: 8px 0 0; color: var(--muted); max-width: 65ch; }
.volver { color: var(--muted); text-decoration: none; font-size: .9rem; }
.volver:hover { color: var(--ink); }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 .95rem var(--f-body); text-decoration: none; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn-pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-pri:hover { border-color: var(--ink); }
.btn-mal { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn-chico { padding: 5px 12px; font-size: .85rem; margin-top: 8px; }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }

/* indicadores */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; color: var(--muted); font-size: .9rem; }
.kpi-v { font-size: 1.9rem; font-weight: 500; color: var(--ink); line-height: 1.2; }
.kpi-mal .kpi-v { color: var(--bad); }

.barra-filtros { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.barra-filtros label, .lbl { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
select, input[type="text"], input:not([type]), input[type="date"] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 500 .88rem var(--f-body); padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; }
.chip .mono { color: var(--muted); font-size: .8em; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] .mono { color: inherit; opacity: .7; }

/* tabla de ingresos */
.tabla { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.fila { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 2.2fr) 110px; gap: 16px; align-items: center; padding: 14px 16px; text-decoration: none; border-top: 1px solid var(--line); }
.fila:first-child { border-top: 0; }
.fila:hover { background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.fila small { display: block; color: var(--muted); font-size: .85rem; }
.fila-dia { font-size: .9rem; }
.fila-avance { display: flex; align-items: center; gap: 10px; font-size: .85rem; }
.fila-estado { justify-self: end; }
.barra { flex: 1; height: 6px; min-width: 60px; background: var(--line); border-radius: 3px; overflow: hidden; display: block; }
.barra > span { display: block; height: 100%; background: var(--accent); }

.pill { display: inline-block; font: 500 .72rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
.pill-atrasado { background: var(--bad-bg); color: var(--bad); }
.pill-aldia { background: var(--ok-bg); color: var(--ok); }
.pill-proximo { background: var(--warn-bg); color: var(--warn); }
.pill-completo { background: var(--ink); color: var(--bg); }
.tag-ej { font: 500 .68rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; border: 1px dashed var(--muted); color: var(--muted); padding: 0 5px; border-radius: 3px; vertical-align: middle; }
.txt-mal { color: var(--bad) !important; }
.txt-ok { color: var(--ok); }
.nota { color: var(--muted); font-size: .9rem; margin: 0; }
.vacio { color: var(--muted); padding: 16px; margin: 0; }

/* formulario */
.form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.campo label { font-weight: 600; font-size: .9rem; }
.form .nota, .form .acciones { grid-column: 1 / -1; }
.acciones { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ficha del ingreso */
.ficha { align-items: stretch; }
.datos { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 12px 0 0; }
.datos dt { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.datos dd { margin: 0; font-weight: 500; }
.ficha-estado { display: flex; flex-direction: column; gap: 6px; min-width: 200px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.ficha-estado .pill { align-self: flex-start; }
.ficha-estado small { color: var(--muted); }
.ficha-estado .barra { flex: none; }

.etapa { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.etapa-cab { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.etapa-meta { margin-left: auto; font-size: .8rem; color: var(--muted); }
.codigo { display: inline-block; min-width: 3.4em; text-align: center; font-size: .75rem; font-weight: 500; padding: 2px 6px; border: 1px solid var(--ink); border-radius: 3px; }
.tareas { list-style: none; margin: 0; padding: 0; }
.tarea { display: flex; gap: 14px; padding: 14px 16px; border-top: 1px solid var(--line); }
.tarea:first-child { border-top: 0; }
.tarea.venc { box-shadow: inset 3px 0 0 var(--bad); }
.tarea input[type="checkbox"], .check-q { flex: none; width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); cursor: pointer; }
.check-q { display: grid; place-items: center; border: 1.5px solid var(--muted); border-radius: 4px; font-size: .8rem; color: var(--muted); cursor: default; }
.hecha .check-q { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tarea-cuerpo { flex: 1; min-width: 0; }
.tarea-tit { font-weight: 600; cursor: pointer; }
.hecha .tarea-tit { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.tarea-cuerpo p { margin: 2px 0 8px; color: var(--muted); font-size: .92rem; max-width: 75ch; }
mark.validar { background: var(--mark); color: var(--ink); font: 500 .72rem var(--f-mono); letter-spacing: .04em; padding: 1px 4px; border-radius: 2px; }
.tarea-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .8rem; align-items: center; }
.resp { font-weight: 600; }
.tipo, .origen { color: var(--muted); }
.tipo::before, .origen::before { content: "·"; margin-right: 12px; }
.estado-t { margin-left: auto; color: var(--muted); }
.estado-t.ok { color: var(--ok); }

.quiz { margin-top: 12px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); display: flex; flex-direction: column; gap: 14px; }
.quiz fieldset { border: 0; padding: 0 0 0 12px; margin: 0; border-left: 3px solid var(--line); }
.quiz fieldset.ok { border-left-color: var(--ok); }
.quiz fieldset.mal { border-left-color: var(--bad); }
.quiz legend { font-weight: 600; padding: 0; margin-bottom: 6px; }
.quiz label { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: .95rem; cursor: pointer; }
.quiz input { accent-color: var(--accent); }

.pie-ficha { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: .9rem; }

/* programa */
.pista-intro p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.pista-intro .meta { font-size: .8rem; }
.grilla { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.col header { font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.col ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.col li strong { font-weight: 500; display: block; line-height: 1.3; }
.col li small { color: var(--muted); font-size: .8rem; }
.col .vacio { padding: 0; }
code { font-family: var(--f-mono); font-size: .88em; background: var(--surface); border: 1px solid var(--line); padding: 0 4px; border-radius: 3px; }

@media (max-width: 860px) {
  .fila { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; }
  .fila-quien { grid-column: 1; }
  .fila-estado { grid-column: 2; grid-row: 1; }
  .fila-dia, .fila-avance, .fila-prox { grid-column: 1 / -1; }
  .fila-dia small { display: inline; margin-left: 6px; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .grilla { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .form { grid-template-columns: 1fr; }
  .grilla { grid-template-columns: minmax(0, 1fr); }
  .estado-t { margin-left: 0; flex-basis: 100%; }
  .nav { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <a class="marca" href="#panel">Flyzar <span>Inducción</span></a>
  <nav class="nav" aria-label="Secciones">
    <a href="#panel">Panel</a>
    <a href="#programa">Programa</a>
  </nav>
</div></div>
<main id="vista"></main>
<script src="contenido.js"></script>
<script src="app.js"></script>
</body>
</html>
